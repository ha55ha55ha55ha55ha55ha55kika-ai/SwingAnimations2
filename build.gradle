plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Необязательно: нужен только чтобы скомпилировать ModMenuIntegration.
    // Не хотите ModMenu: удалите эту строку, compat/ModMenuIntegration.java и entrypoint "modmenu" в fabric.mod.json.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // MP3-декодер для модуля Music. include вшивает его в jar мода (Jar-in-Jar): отдельно ставить ничего не нужно.
    implementation("com.googlecode.soundlibs:jlayer:1.0.1.4") { transitive = false }
    include("com.googlecode.soundlibs:jlayer:1.0.1.4") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
